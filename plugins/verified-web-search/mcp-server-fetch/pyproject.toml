[project]
name = "mcp-server-fetch"
version = "0.6.3"
description = "A Model Context Protocol server providing tools to fetch and convert web content for usage by LLMs (customized fork)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anthropic, PBC." },
    { name = "MetalMental" },
]
maintainers = [{ name = "MetalMental", email = "flupino@metalmental.net" }]
keywords = ["http", "mcp", "llm", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "httpx>=0.27",
    "markdownify>=0.13.1",
    "mcp>=2.0.0",
    "protego>=0.3.1",
    "pydantic>=2.0.0",
    "trafilatura>=2.0",
]

[project.urls]
Repository = "https://github.com/Flupinochan/metalmental-claude"
Issues = "https://github.com/Flupinochan/metalmental-claude/issues"
Upstream = "https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"

[project.scripts]
mcp-server-fetch = "mcp_server_fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.411", "ruff>=0.16.3", "pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
