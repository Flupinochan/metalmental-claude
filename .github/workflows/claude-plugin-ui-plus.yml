name: claude-plugin-ui-plus

on:
  pull_request:
    paths:
      - "plugins/ui-plus/**"
      - ".github/workflows/claude-plugin-ui-plus.yml"

permissions:
  contents: read

jobs:
  claude-plugin-ui-plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate plugins/ui-plus
      - run: claude plugin test plugins/ui-plus
